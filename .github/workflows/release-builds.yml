# Builds the companion for macOS and Linux when a release is published, and attaches the programs to
# that release. The Windows exe is built and attached by hand (npm run build-exe on Windows).
# Can also be run by hand from the Actions tab, for a tag that already has a release.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the builds to (for example v0.4.1)
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-apple-silicon
          - os: macos-13
            name: macos-intel
          - os: ubuntu-latest
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      # tools/build-exe.js needs Node 25.5 or later (--build-sea).
      - uses: actions/setup-node@v4
        with:
          node-version: '26.x'
      - run: npm test
      - run: node tools/build-exe.js
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          cd dist
          zip -q "MelvorIdle2Companion-${{ matrix.name }}.zip" MelvorIdle2Companion
          gh release upload "$TAG" "MelvorIdle2Companion-${{ matrix.name }}.zip" --clobber
