<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Melvor Idle 2 Companion</title>
  <link rel="icon" id="favicon" type="image/svg+xml" href="/ui/brand/logo.svg">
  <script>
    // Apply the saved theme before the first paint.
    try {
      const theme = JSON.parse(localStorage.getItem('melvor-companion:theme'));
      if (theme && theme !== 'system') document.documentElement.dataset.theme = theme;
    } catch {}
  </script>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/overview"><span class="brand-mark logo" id="brand-mark" aria-hidden="true"><img src="/ui/brand/logo.svg" alt=""></span>Melvor Idle 2 Companion</a>
    <div class="top-alerts" id="top-alerts" role="status" aria-live="polite"></div>
    <div class="savebar" id="savebar"></div>
    <div class="heartbeat" aria-hidden="true"><span id="heartbeat"></span></div>
  </header>
  <div class="layout">
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
    <main id="view" tabindex="-1"><p class="loading">Loading game data…</p></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="hover-card" id="hover-card" role="tooltip" hidden></div>
  <script type="module" src="/ui/app.js"></script>
</body>
</html>
